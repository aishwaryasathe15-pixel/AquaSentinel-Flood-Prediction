{% extends "base.html" %}{% block title %}Login | AquaSentinel{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><div class="feature-icon">🌊</div><h2>Welcome back</h2><p class="text-secondary">Sign in to your flood-risk dashboard.</p>
<form method="post"><label class="form-label">Username or email</label><input class="form-control mb-3" name="identity" required autocomplete="username">
<label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required autocomplete="current-password">
<button class="btn btn-primary w-100">Login securely</button></form><p class="mt-3 mb-0 text-center">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
