{% extends "base.html" %}{% block title %}Create account | AquaSentinel{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><div class="feature-icon">🛡️</div><h2>Create account</h2><p class="text-secondary">Your prediction history is saved to your account.</p>
<form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required minlength="3" autocomplete="username">
<label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required autocomplete="email">
<label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-4" name="password" type="password" minlength="8" required autocomplete="new-password">
<button class="btn btn-primary w-100">Create account</button></form><p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></div>{% endblock %}
